{{define "layout"}}<!doctype html>
<html lang="en" data-theme="{{if .Theme}}{{.Theme}}{{else}}emerald{{end}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Recipes</title>
<!-- daisyUI (MIT) on top of Tailwind CSS: the design system is theirs, not invented here. -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  @media print {
    .navbar, footer, .print\:hidden { display: none !important; }
    body { background: #fff; }
    .card, .shadow-sm { box-shadow: none !important; }
  }
</style>
</head>
<body class="min-h-screen bg-base-200">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:m-2 focus:btn focus:btn-sm">Skip to content</a>
<div class="navbar bg-base-100 shadow-sm sticky top-0 z-10 print:hidden">
  <div class="mx-auto flex w-full max-w-5xl items-center px-2">
    <a href="/" class="btn btn-ghost text-xl">🍳 Recipes</a>
    <nav class="ml-auto">
      <ul class="menu menu-horizontal gap-1 px-1">
        <li><a href="/" class="{{if eq .Title "Recipes"}}menu-active font-semibold{{end}}">All recipes</a></li>
        <li><a href="/plan" class="{{if .Week}}menu-active font-semibold{{end}}">This week</a></li>
      </ul>
    </nav>
  </div>
</div>

<main id="main" class="mx-auto w-full max-w-5xl px-4 py-8">
  {{template "content" .}}
</main>

<footer class="footer footer-center p-6 text-base-content/60 print:hidden">
  <aside><p>Served from the repo — recipes/ and meal-plans/ are the source of truth.</p></aside>
</footer>
</body>
</html>{{end}}
