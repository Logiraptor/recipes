{{define "layout"}}<!doctype html>
<html lang="en" data-theme="{{if .Theme}}{{.Theme}}{{else}}emerald{{end}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Recipes</title>
<!-- daisyUI (MIT) on top of Tailwind CSS: the design system is theirs, not invented here. -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200">
<div class="navbar bg-base-100 shadow-sm sticky top-0 z-10">
  <div class="flex-1">
    <a href="/" class="btn btn-ghost text-xl">🍳 Recipes</a>
  </div>
  <div class="flex-none">
    <ul class="menu menu-horizontal px-1">
      <li><a href="/">All recipes</a></li>
      <li><a href="/plan">This week</a></li>
    </ul>
  </div>
</div>

<main class="mx-auto w-full max-w-5xl px-4 py-8">
  {{template "content" .}}
</main>

<footer class="footer footer-center p-6 text-base-content/60">
  <aside><p>Served from the repo — recipes/ and meal-plans/ are the source of truth.</p></aside>
</footer>
</body>
</html>{{end}}
